<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:32px 16px;background:#f5f6fa;font-family:Arial,sans-serif;color:#273044">
<div style="max-width:480px;margin:auto;padding:32px;background:#fff;border-radius:16px">
<h1 style="font-size:24px">DegenDNA 邮箱验证码</h1>
<p>请在你刚才打开的 DegenDNA 页面输入以下验证码，完成邮箱验证：</p>
<p style="font-size:32px;font-weight:bold;letter-spacing:6px;padding:20px 0">{{ .Token }}</p>
<p>请使用最新一封邮件中的验证码。若已过期，请返回页面重新申请。</p>
<p>验证码仅供本人登录或确认账号操作，请勿转发给他人。若不是你本人申请，可以忽略这封邮件。</p>
<p style="color:#647084;font-size:13px">DegenDNA 不会通过邮件索取你的测评答案、钱包私钥或密码。</p>
</div></body></html>
